version: 1
paths:
  state_dir: /tmp/twindb-backup/state
  lock_file: /tmp/twindb-backup/lock

mysql:
  defaults_file: tests/integration/my.cnf
  mysql_binary: mysql
  mysqlbinlog_binary: mysqlbinlog
  xtrabackup_binary: xtrabackup
  xbcloud_binary: tests/integration/xbcloud-mock.sh
  xbstream_binary: xbstream
  full_backup: daily
  expire_log_days: 7
  capture_runtime_config: true
  skip_backup_locks: false
  redo_log_archive_dir: ""

backup:
  intervals:
    hourly: true
    daily: true
    weekly: false
    monthly: false
    yearly: false

compression:
  method: gzip
  level: 6
  threads: 1

destination:
  kind: xbcloud
  provider: s3
  remote_path: /backups/mysql
  keep_local_path: ""

s3:
  bucket: mock-bucket
  region: us-east-1
  access_key: mock
  secret_key: mock
  endpoint: ""

retention:
  remote:
    hourly: 24
    daily: 7
    weekly: 4
    monthly: 12
    yearly: 3
  local:
    hourly: 0
    daily: 0
    weekly: 0
    monthly: 0
    yearly: 0
